[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attestd"
dynamic = ["version"]
description = "Python SDK for the Attestd security risk API"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
keywords = ["security", "cve", "vulnerability", "appsec", "devsecops", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27.0",
]

[tool.hatch.version]
path = "attestd/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["attestd"]

[project.urls]
Homepage   = "https://attestd.io"
Docs       = "https://attestd.io/docs"
Repository = "https://github.com/attestd/attestd-python"
"Bug Tracker" = "https://github.com/attestd/attestd-python/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "anyio[trio]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths   = ["tests"]
